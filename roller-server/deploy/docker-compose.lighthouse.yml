# Lighthouse 单机部署（roll.acgun.cn）
# ------------------------------------------------------------------
# 前后端同域：一个域名、一张证书、不跨域。
#   https://roll.acgun.cn/api/*  -> 本文件里的 roll 容器（后端）
#   https://roll.acgun.cn/*      -> nginx 静态目录 /var/www/web（Web 前端）
#
# 与 docker-compose.yml 的区别：
#   1. PostgreSQL 数据通过 bind mount 持久化到宿主机 /data/docker/pgsql/
#   2. api 容器命名为 roll，只加入外部网络 web，不映射宿主机端口
#   3. 由已有的 nginx 容器（/data/docker/nginx）反代到 roll:8080
#   4. 镜像不本地构建 —— 由 GitHub Actions 构建并推送到 Docker Hub，服务器直接 pull
#
# 用法（在服务器的 /data/docker/roll 目录下）：
#   cp .env.example .env    # 填好 PostgreSQL 密码、JWT 密钥、微信 AppId/AppSecret
#   docker compose -f docker-compose.lighthouse.yml pull
#   docker compose -f docker-compose.lighthouse.yml up -d
#
# 更新版本：
#   docker compose -f docker-compose.lighthouse.yml pull api
#   docker compose -f docker-compose.lighthouse.yml up -d api
#
# 首次启动会自动建表（Database__AutoMigrate=true）；建完后可改成 false。

services:
  db:
    image: postgres:16-alpine
    container_name: roll-pgsql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ledger}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      # 持久化到宿主机目录，容器重建不丢数据
      - /data/docker/pgsql:/var/lib/postgresql/data
    # 不对外暴露端口，只有同网络的 api 能访问
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ledger}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - web

  api:
    # 由 GitHub Actions 构建推送（仓库 .github/workflows/docker-publish.yml）
    # 想锁定版本时把 latest 换成具体标签，例如 crazor6/roll:sha-a1b2c3d
    image: ${ROLL_IMAGE:-crazor6/roll:latest}
    container_name: roll
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Roll: ${ConnectionStrings__Roll:-Host=roll-pgsql;Port=5432;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};Database=${POSTGRES_DB:-ledger};Timeout=15;Command Timeout=120}
      Jwt__Key: ${Jwt__Key:?请在 .env 中设置 Jwt__Key}
      Jwt__Issuer: ${Jwt__Issuer:-ledger}
      Jwt__Audience: ${Jwt__Audience:-ledger-miniprogram}
      WeChat__AppId: ${WeChat__AppId:-}
      WeChat__AppSecret: ${WeChat__AppSecret:-}
      Auth__AllowDevLogin: "false"
      # 单机部署只有这一个 api 容器，不存在多实例并发执行 DDL 的问题。
      # MigrateAsync 本身幂等（已有迁移会自动跳过），所以保持 true 最省事：
      # 每次发布新版本带迁移时，容器起来就自己把表结构升上去，不用再登服务器手动跑。
      Database__AutoMigrate: ${Database__AutoMigrate:-true}
    # 不映射宿主机端口；nginx 通过 web 网络直接访问 roll:8080
    networks:
      - web

networks:
  web:
    external: true
    name: web

# nginx 不在本文件里管（它跑在 /data/docker/nginx，独立容器），
# 但前端静态目录需要挂进它，否则容器里看不到产物。
# 首次部署时给 nginx 容器加一条挂载即可（一次性操作）：
#
#   docker run 启动的：在启动参数里加
#     -v /data/docker/web:/var/www/web:ro
#   compose 管的：在它的 volumes 里加
#     - /data/docker/web:/var/www/web:ro
#
# 挂载是只读的（:ro）—— 容器只需要读文件，写权限留给 deploy-web.sh。
