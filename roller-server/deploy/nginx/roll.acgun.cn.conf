# HTTP: 仅用于 ACME 验证与跳转 HTTPS
server {
    listen       80;
    listen  [::]:80;
    server_name  roll.acgun.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP: IP 直访与其它域名，保持可用
server {
    listen       80;
    listen  [::]:80;
    server_name  43.142.101.186 _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }
}

# HTTPS 主站：单域名同源部署
#   · /api/*  -> 反代到 roll 容器（后端 ASP.NET Core）
#   · 其余     -> nginx 直接吐 Web 前端静态文件（SPA）
#
# 同源的好处：浏览器不发跨域请求，不需要 CORS 白名单、没有预检、Cookie 也是同站；
# 小程序照旧请求 https://roll.acgun.cn/api/...，完全不受影响。
server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    http2        on;
    server_name  roll.acgun.cn;

    ssl_certificate      /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key  /etc/nginx/certs/privkey.pem;

    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers  off;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # 请求体上限（账目载荷都很小，留些余量即可）
    client_max_body_size 2m;

    # Web 前端静态文件目录。宿主机 /data/docker/web 挂载到容器同一路径，
    # 发布前端时把 dist/ 的内容同步过去即可，不需要动 nginx 配置。
    root  /var/www/web;
    index index.html;

    # ---- 后端 API：转发到 roll 容器 ----
    # 注意 location 末尾不带斜杠，proxy_pass 也带 /api/，
    # 这样 /api/entries 会原样透传为 http://roll:8080/api/entries。
    location /api/ {
        proxy_pass         http://roll:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # 接口响应不要缓存
        proxy_buffering off;
    }

    # 后端健康检查（给部署脚本 / 监控用，不暴露到前端路由里）
    location = /health {
        proxy_pass         http://roll:8080/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ---- 前端静态资源：带哈希的产物可以长期缓存 ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 前端路由：SPA 回退到 index.html（/login、/charts 这类前端路由都能直达）----
    # index.html 本身不能被缓存，否则用户会一直拿到旧版本
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 首页也不缓存
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
