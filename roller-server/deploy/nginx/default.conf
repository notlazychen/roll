# roll.acgun.cn 主站配置（单域名同源部署）
# ------------------------------------------------
#   /health  与 /api/*  -> roll 容器（后端 API，容器网络别名 roll:8080）
#   其余路径            -> /var/www/web 静态文件（Web 前端，SPA 回退 index.html）
#
# 静态目录由 update-web.sh 从 crazor6/roll-web 镜像原子发布。
# 修改本文件后：docker exec nginx nginx -t && docker exec nginx nginx -s reload

# HTTP: 仅用于 ACME 验证与跳转 HTTPS
server {
    listen       80;
    listen  [::]:80;
    server_name  roll.acgun.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP: IP 直访与其它域名，保持可用
server {
    listen       80;
    listen  [::]:80;
    server_name  43.142.101.186 _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }
}

# HTTPS 主站
server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    http2        on;
    server_name  roll.acgun.cn;

    ssl_certificate      /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key  /etc/nginx/certs/privkey.pem;

    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers  off;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    client_max_body_size 2m;

    # 后端健康检查
    location = /health {
        proxy_pass         http://roll:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    # 后端 API
    location /api/ {
        proxy_pass         http://roll:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        proxy_buffering off;
    }

    # Web 前端静态文件 + SPA 回退
    location / {
        root  /var/www/web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
