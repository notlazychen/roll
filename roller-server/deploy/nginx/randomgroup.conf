# Nginx 反向代理配置
# ------------------------------------------------------------------
# 微信小程序对服务端有几个硬性要求，这份配置里都已满足：
#   1) 必须 HTTPS，证书由受信任 CA 签发（自签无效）；
#   2) TLS 版本必须 1.2 及以上；
#   3) 需要返回完整证书链（fullchain.pem），只给站点证书会校验失败。
#
# 用法：
#   cp randomgroup.conf /etc/nginx/conf.d/
#   把 server_name 和证书路径换成你自己的
#   nginx -t && systemctl reload nginx

# HTTP 全部跳转到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.your-domain.com;

    # 证书签发/续期的校验文件目录（Let's Encrypt 等）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.your-domain.com;

    # fullchain 就是完整证书链，别只填站点证书
    ssl_certificate     /etc/nginx/ssl/api.your-domain.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/api.your-domain.com.key;

    # 微信要求 TLS 1.2+，不要放开 1.0/1.1
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 4m;

    # 服务端日志里能看到真实 IP
    access_log /var/log/nginx/randomgroup.access.log;
    error_log  /var/log/nginx/randomgroup.error.log;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 数据库 CommandTimeout 是 120 秒，这里留出富余
        proxy_connect_timeout 10s;
        proxy_send_timeout    130s;
        proxy_read_timeout    130s;
    }

    # 健康检查不写访问日志，避免刷屏
    location = /health {
        proxy_pass http://127.0.0.1:5080/health;
        access_log off;
    }
}
